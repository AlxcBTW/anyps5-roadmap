name: Label PRs

# Adds data-correction, mining or rendering to a PR from the paths it changes
# (rules in .github/labeler.yml).
#
# pull_request_target is what lets this label PRs from forks. It is safe here
# because nothing from the PR is checked out or run: actions/labeler only reads
# the list of changed files through the API, and the token can do nothing but
# edit labels. Do not add a checkout or a build step to this workflow.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
